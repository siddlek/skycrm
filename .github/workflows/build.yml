name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 openpyxl

      - name: exe로 빌드
        run: |
          pyinstaller --onefile --noconsole --name SkyCRM call_manager_lite.py

      - name: 빌드 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: SkyCRM-windows-exe
          path: dist/SkyCRM.exe
