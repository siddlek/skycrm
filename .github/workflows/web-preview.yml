name: Deploy web preview to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/web-preview.yml'
      - '.github/scripts/build-pages.py'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build assets with unique filenames
        run: python3 .github/scripts/build-pages.py "$RUNNER_TEMP/skycrm-pages" --commit "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/skycrm-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
