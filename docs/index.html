<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky CRM 웹 체험판</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#202738;font:15px system-ui,sans-serif}header,main{max-width:1150px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:25px;color:#3449a0}small,.muted{color:#677188}nav{display:flex;gap:8px;border-bottom:1px solid #dce0ec;margin-bottom:24px}button,input,select,textarea{font:inherit;border:1px solid #d8deeb;border-radius:8px;padding:10px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#edf0ff}nav button{border:0;background:transparent;border-radius:8px 8px 0 0;padding:15px 22px}nav .active,.primary{background:#455ad0;color:white}.panel{background:white;border:1px solid #e1e5ef;border-radius:14px;padding:24px;margin:16px 0}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h2{font-size:20px;margin:0 0 8px}form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}label{display:flex;flex-direction:column;gap:6px;font-size:13px}textarea{min-height:95px;resize:vertical}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:14px 10px;border-bottom:1px solid #edf0f6;white-space:pre-wrap;overflow-wrap:anywhere}th{font-size:13px;color:#677188}td button{padding:5px 9px;margin:2px}.scroll{overflow:auto}.empty{text-align:center;color:#8790a4;padding:36px}.note{border:1px solid #e2e6ef;border-radius:10px;padding:18px;margin:12px 0}.done .text{text-decoration:line-through;color:#8a93a5}.text{white-space:pre-wrap;margin:12px 0}.badge{font-size:12px;background:#eef0ff;color:#455ad0;padding:4px 8px;border-radius:5px}#status{min-height:24px;color:#315c45}footer{padding:20px 0;color:#677188;font-size:13px}@media(max-width:700px){form{grid-template-columns:1fr}header,main{padding:16px}header{align-items:start;gap:10px}.panel{padding:16px}nav button{padding:13px}table{min-width:650px}}

/* Desktop application's compact, neutral tab-and-table layout. */
body{background:#F7F7F5;color:#2F3437;font-size:14px}header,main{max-width:none;padding:16px 34px}header{padding-bottom:12px;border-bottom:1px solid #E6E4DF}h1{font-size:20px;color:#2F3437}header small{display:none}nav{gap:0;margin-bottom:14px;border-color:#DAD7D0}nav button{padding:10px 24px;border:1px solid #DAD7D0;border-bottom:0;background:#EDEDE9}nav .active{background:white;color:#2F3437;font-weight:600}.primary{background:#EDEBE7;color:#2F3437;border-color:#CCCAC3}button,input,select,textarea{border-radius:4px;padding:7px 10px;border-color:#DAD7D0}button:hover{background:#EDEBE7}.panel{border-radius:5px;padding:18px;margin:12px 0;border-color:#DAD7D0}h2{font-size:15px}th{background:#F0F0EC;color:#55554F}td,th{padding:10px;border-bottom:1px solid #E6E4DF}tbody tr:nth-child(even){background:#FAFAF8}.badge{background:#EDEBE7;color:#5B5B54;border-radius:3px}#status{margin:8px 0;font-size:12px;min-height:18px}.memo-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.memo-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:16px}.memo-layout .panel{margin:0 0 14px}.memo-editor form{display:flex;flex-direction:column}.memo-editor textarea{min-height:280px}.selected{outline:2px solid #A8A79C;outline-offset:-2px}tr.done td:first-child{text-decoration:line-through;color:#888}.memo-list table{min-width:0}.memo-list td{cursor:pointer}.memo-list .text{margin:0;max-width:500px}.memo-list td small{display:block;margin-top:5px}.memo-layout label[hidden]{display:none}footer{font-size:12px}@media(max-width:800px){.memo-layout{grid-template-columns:1fr}header,main{padding:14px}.memo-editor textarea{min-height:160px}}
</style>
<header><div><h1>Sky CRM</h1><small>통화부터 후속 업무까지, 한곳에서</small></div><span class="badge">웹 체험판 · 브라우저 저장</span></header>
<main><nav aria-label="기능 탭"><button data-tab="calls" class="active">통화 기록</button><button data-tab="clients">거래처 DB</button><button data-tab="memos">메모</button></nav><div class="bar"><span class="muted">이 브라우저에만 저장됩니다. 데스크톱 앱과 자동 연동되지 않습니다.</span><button id="sample">예시 데이터 넣기</button></div><p id="status" role="status"></p><div id="app"></div><footer>개인정보 대신 예시 정보로 체험해 주세요. 브라우저 데이터를 삭제하면 기록도 사라집니다.</footer></main>
<script>
'use strict';
const KEY='skycrm-web-preview-v1';let state={calls:[],clients:[],memos:[]},tab='calls',editing=null,query='';
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&['calls','clients','memos'].every(k=>Array.isArray(s[k])))state=s}catch(e){document.querySelector('#status').textContent='저장된 데이터를 읽지 못했습니다. 새 화면으로 시작합니다.'}
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#status').textContent='이 브라우저에 저장했습니다.';return true}catch(e){$('#status').textContent='브라우저 저장에 실패했습니다. 이 화면을 닫으면 변경 내용이 사라질 수 있습니다.';return false}}
const field=(key,label,value='',type='text')=>`<label>${label}<input name="${key}" type="${type}" value="${esc(value)}" ${key==='name'?'required':''}></label>`;
function render(){
const item=state[tab].find(x=>x.id===editing)||{},isMemo=tab==='memos',isCall=tab==='calls';
if(isMemo){renderMemos(item);return;}
const title=isCall?'통화 기록':isMemo?'메모 · 할 일':'거래처 DB';
$('#app').innerHTML=`<section class="panel"><h2>${editing?'선택 항목 수정':isMemo?'새 메모 작성':(isCall?'신규 통화 기록':'거래처 등록')}</h2><form id="entry">${isMemo?`<label>종류<select name="kind"><option value="note">일반 메모</option><option value="task" ${item.kind==='task'?'selected':''}>할 일</option></select></label>`:''}${field('name',isMemo?'제목':'거래처명',item.name)}${!isMemo?field('phone','전화번호',item.phone):''}${isCall?field('date','통화 일시',item.date||localDate(),'datetime-local')+`<label>구분<select name="type"><option>수신</option><option ${item.type==='발신'?'selected':''}>발신</option><option ${item.type==='부재중'?'selected':''}>부재중</option></select></label>`:''}<label class="wide">${isCall?'통화 내용':'내용'}<textarea name="content">${esc(item.content)}</textarea></label><div class="actions wide"><button class="primary" type="submit">${editing?'수정 저장':'추가하기'}</button>${editing?'<button type="button" id="cancel">취소</button>':''}</div></form></section><section class="panel"><div class="bar"><h2>${title} <small>(${state[tab].length})</small></h2><input id="search" type="search" aria-label="검색" placeholder="이름·내용·전화번호 검색" value="${esc(query)}"></div><div id="list"></div></section>`;
renderList();$('#entry').onsubmit=save;$('#search').oninput=e=>{query=e.target.value;renderList()};if($('#cancel'))$('#cancel').onclick=()=>{editing=null;render()};
}
function renderMemos(item){
$('#app').innerHTML=`<div class="memo-toolbar"><button data-new-kind="task">+ 할 일</button><button data-new-kind="note">+ 일반 메모</button></div><div class="memo-layout"><section class="memo-list"><div class="bar"><h2>메모 / 할 일 목록</h2><input id="search" type="search" aria-label="메모 검색" placeholder="내용 검색" value="${esc(query)}"></div><div id="list"></div></section><section class="panel memo-editor"><h2>${editing?'선택한 항목 수정':'새 메모 작성'}</h2><form id="entry"><label>종류<select name="kind"><option value="note">일반 메모</option><option value="task" ${item.kind==='task'?'selected':''}>할 일</option></select></label><label>제목 (선택)<input name="name" value="${esc(item.name)}"></label><label id="memo-phone" ${item.kind==='task'?'':'hidden'}>전화번호 (선택)<input name="phone" value="${esc(item.phone)}" ${item.kind==='task'?'':'disabled'}></label><label>내용<textarea name="content" required placeholder="메모나 할 일을 자유롭게 적어 주세요.">${esc(item.content)}</textarea></label><div class="actions"><button class="primary" type="submit">${editing?'수정 저장':'추가하기'}</button>${editing?'<button type="button" id="cancel">취소</button>':''}</div></form></section></div>`;
renderList();$('#entry').onsubmit=save;$('#search').oninput=e=>{query=e.target.value;renderList()};
$('#entry select').onchange=e=>{const task=e.target.value==='task';$('#memo-phone').hidden=!task;$('#memo-phone input').disabled=!task};
if($('#cancel'))$('#cancel').onclick=()=>{editing=null;render()};
}
function localDate(){const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function renderList(){const rows=state[tab].filter(x=>[x.name,x.content,x.phone].some(v=>String(v||'').toLowerCase().includes(query.toLowerCase())));const actions=x=>`<button data-action="edit" data-id="${esc(x.id)}">수정</button><button data-action="delete" data-id="${esc(x.id)}">삭제</button>`;
if(tab==='memos'){
$('#list').innerHTML=['task','note'].map(kind=>{const entries=rows.filter(x=>x.kind===kind);return `<section class="panel"><h2>${kind==='task'?'할 일 (완료 항목도 표시)':'일반 메모'}</h2>${entries.length?`<table><thead><tr><th>내용</th><th>관리</th></tr></thead><tbody>${entries.map(x=>`<tr class="${x.done&&kind==='task'?'done ':''}${x.id===editing?'selected':''}"><td data-action="edit" data-id="${esc(x.id)}"><strong>${esc(x.name||'메모')}</strong><div class="text">${esc(x.content)}</div>${kind==='task'&&x.phone?`<small>${esc(x.phone)}</small>`:''}</td><td>${kind==='task'?`<button data-action="done" data-id="${esc(x.id)}">${x.done?'☑ 완료':'☐ 미완료'}</button>`:''}${actions(x)}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">등록된 항목이 없습니다.</p>'}</section>`}).join('');return;}
$('#list').innerHTML=rows.length?`<div class="scroll"><table><thead><tr><th>거래처</th>${tab==='calls'?'<th>일시 / 구분</th>':''}<th>전화번호</th><th>내용</th><th>관리</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td>${tab==='calls'?`<td>${esc(x.date?.replace('T',' '))}<br><small>${esc(x.type)}</small></td>`:''}<td>${esc(x.phone)}</td><td>${esc(x.content)}</td><td>${actions(x)}${tab==='calls'?`<button data-action="task" data-id="${esc(x.id)}">할 일로 추가</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">표시할 항목이 없습니다. 위에서 추가하거나 예시 데이터를 넣어 보세요.</p>';
}
function save(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(tab==='memos'){if(!data.content.trim())return;}else if(!data.name.trim())return;const old=state[tab].find(x=>x.id===editing);if(old)Object.assign(old,data);else state[tab].unshift({...data,id:id(),done:false});persist();editing=null;render()}
$('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;editing=null;query='';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()};
$('#app').onclick=e=>{const create=e.target.closest('[data-new-kind]');if(create){editing=null;renderMemos({kind:create.dataset.newKind});$('#entry textarea').focus();return;}const b=e.target.closest('[data-action]');if(!b)return;const x=state[tab].find(x=>x.id===b.dataset.id);if(!x)return;switch(b.dataset.action){case'edit':editing=x.id;render();$('#entry input').focus();return;case'delete':if(!confirm('선택한 항목을 삭제할까요?'))return;state[tab]=state[tab].filter(i=>i.id!==x.id);if(editing===x.id)editing=null;break;case'done':x.done=!x.done;break;case'task':state.memos.unshift({id:id(),name:x.name+' 후속 연락',phone:x.phone,content:x.content,kind:'task',done:false});break}persist();render()};
$('#sample').onclick=()=>{if(state.calls.length||state.clients.length||state.memos.length){if(!confirm('기존 항목을 유지하고 예시 데이터를 추가할까요?'))return}state.clients.push({id:id(),name:'예시상사',phone:'010-0000-0000',content:'체험용 거래처입니다.'});state.calls.push({id:id(),name:'예시상사',phone:'010-0000-0000',date:localDate(),type:'수신',content:'견적을 요청했습니다. 금요일에 다시 연락하기.'});state.memos.push({id:id(),name:'금요일 견적 안내',phone:'',content:'요청한 견적을 확인하고 전화하기.\n수정 버튼으로 내용을 바꿔 보세요.',kind:'task',done:false},{id:id(),name:'자유 메모',phone:'',content:'통화와 관계없는 아이디어도 적어 두세요.',kind:'note',done:false});persist();render()};render();
</script></html>
